name: graph-node image
# graph-node is published for x86-64 only, and emulated on an Apple Silicon Mac it does not survive
# a sync. This builds it from its own source and Dockerfile, unmodified, for both architectures.
on:
  workflow_dispatch:
    inputs:
      version:
        description: graph-node tag to build, e.g. v0.45.0
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nuthatch-org/graph-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: graphprotocol/graph-node
          ref: ${{ inputs.version }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: graph-node
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.version }}-${{ matrix.arch }}
          build-args: |
            TAG_NAME=${{ inputs.version }}
            COMMIT_SHA=${{ steps.source.outputs.sha }}
            REPO_NAME=graphprotocol/graph-node
          labels: |
            org.opencontainers.image.source=https://github.com/graphprotocol/graph-node
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.description=graph-node ${{ inputs.version }}, built unmodified from source for Lodestar Drydock

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$IMAGE:${{ inputs.version }}" \
            "$IMAGE:${{ inputs.version }}-amd64" "$IMAGE:${{ inputs.version }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
