[package]
name = "drydock"
version = "0.1.4"
edition = "2024"
description = "Lodestar Drydock: run a real graph-node on your own machine against your subgraph"
license = "MIT"
repository = "https://github.com/nuthatch-org/drydock"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wasmparser = "0.263"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
